# The only repo-specific texts of the website. Everything else comes from the
# repository: the English intro from README.md, the commands from the built CLI.

# How the API is accessed: open | key (env: VAR) | account (token, user, password: VARs)
access:
  type: open

de:
  # German version of the README's intro paragraph. Keep it in step with README.md.
  intro: >-
    Das amtliche **Portal für Produktwarnungen**
    ([lebensmittelwarnung.de](https://www.lebensmittelwarnung.de)) direkt im Terminal
    abfragen. `lebensmittel` ist ein Kommandozeilen-Tool für die offiziellen **RSS-Feeds** des
    Portals – die aktuellen Rückrufe für Lebensmittel, Kosmetik und Verbraucherprodukte,
    eingrenzbar nach Bundesland und Produktart, als sauberes JSON, das Sie direkt an
    [`jq`](https://jqlang.github.io/jq/) weitergeben können.
